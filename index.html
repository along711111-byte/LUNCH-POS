<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>午餐結算 - 企業總表版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #FDF9F5; 
            background-image: url('Gemini_Generated_Image_unma06unma06unma.png'); 
            background-size: cover; 
            background-position: center top;
            background-attachment: fixed;
            color: #4A3E3D; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hidden-view { display: none !important; }
        
        .glass-panel { background: rgba(255, 252, 248, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(210, 180, 160, 0.4); box-shadow: 0 8px 30px rgba(100, 70, 50, 0.08); }
        .glass-nav { background: rgba(255, 252, 248, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(210, 180, 160, 0.4); }
        
        .theme-gradient { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%); }
        .theme-text { color: #C85A44; }
        
        .emp-selected { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%) !important; color: white !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(200, 90, 68, 0.3); transform: translateY(-1px); font-weight: 700; }
        .btn-active:active { transform: scale(0.97); }
        
        .nav-active { color: #C85A44; }
        .nav-inactive { color: #B0A09A; }
        
        input[type=checkbox] { accent-color: #C85A44; width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; border: 1px solid #e5e7eb; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); } 
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        #loading-overlay { position: fixed; inset: 0; background: rgba(253, 249, 245, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #C85A44; text-align: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col pb-safe relative">

    <div id="loading-overlay">
        <svg class="w-12 h-12 mb-4 animate-spin text-[#C85A44]" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <h2 class="text-lg font-bold tracking-widest text-[#4A3E3D]" id="loading-text">系統連線中...</h2>
    </div>

    <header class="theme-gradient sticky top-0 z-20 shadow-lg rounded-b-2xl">
        <div class="px-6 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white tracking-widest flex items-center">
                LUNCH POS
            </h1>
            <input type="date" id="order-date" onchange="changeDate()" class="text-sm font-medium text-[#C85A44] bg-white/95 px-3 py-1.5 rounded-full border-none outline-none shadow-sm focus:ring-2 focus:ring-orange-300 transition">
        </div>
    </header>

    <main class="w-full flex-grow relative px-4 mt-6">

        <div id="view-pos" class="space-y-6">
            <div class="relative">
                <select id="store-selector" onchange="changeStore()" class="w-full glass-panel text-[#C85A44] text-lg rounded-2xl p-4 outline-none font-bold text-center appearance-none transition focus:ring-2 focus:ring-[#C85A44]/20"></select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-[#C85A44]"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></div>
            </div>

            <div class="glass-panel p-5 rounded-3xl">
                <div class="mb-5">
                    <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        選擇對象 <span class="text-xs text-stone-400 font-normal ml-2">(可多選批量點餐)</span>
                    </h2>
                    <div id="pending-employees" class="grid grid-cols-3 gap-2.5"></div>
                </div>

                <div class="pt-4 border-t border-orange-100">
                    <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        選擇餐點
                    </h2>
                    <button onclick="addToCart('未點餐', 0)" class="btn-active w-full py-3.5 mb-3 bg-stone-50 border border-stone-200/60 rounded-xl text-center flex justify-center items-center text-stone-500 font-medium hover:bg-stone-100 transition">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        本日跳過 (未點餐)
                    </button>
                    <div id="current-menu" class="grid grid-cols-2 gap-2.5"></div>
                </div>
            </div>

            <div class="theme-gradient p-5 rounded-3xl shadow-[0_10px_25px_rgba(200,90,68,0.25)] sticky bottom-4 z-10">
                <div id="split-toggle-container" class="hidden mb-3 pb-3 border-b border-white/20">
                    <label class="flex items-center space-x-2 text-white text-sm font-medium cursor-pointer">
                        <input type="checkbox" id="is-shared-order" onchange="updateCartUI()" class="rounded shadow-sm">
                        <span>這單為共食 (平分總金額)</span>
                    </label>
                </div>
                <div class="flex justify-between items-end mb-2">
                    <div id="split-info" class="text-xs text-orange-100 font-medium h-4"></div>
                    <div class="text-right">
                        <span class="text-xs text-orange-100 mr-1">合計</span>
                        <span id="cart-total" class="text-2xl font-black text-white">$0</span>
                    </div>
                </div>
                <button onclick="submitCart()" id="submit-btn" class="btn-active w-full mt-3 py-3.5 rounded-xl font-bold tracking-widest transition bg-white/20 text-orange-50 pointer-events-none">
                    請選擇餐點
                </button>
            </div>

            <div class="pt-2">
                <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center justify-between px-1">
                    <span>處理明細 (<span id="display-selected-date" class="text-stone-500">今日</span>)</span>
                </h2>
                <div id="completed-orders" class="space-y-2 mb-6"></div>
                
                <div class="glass-panel p-5 rounded-3xl">
                    <div class="flex justify-between items-center mb-4 border-b border-orange-100 pb-3">
                        <span class="text-sm theme-text font-bold flex items-center">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            店家叫餐清單
                        </span>
                        <span class="text-xs text-stone-500 font-medium">總計：<span id="pos-today-total" class="font-bold theme-text text-lg ml-1">$0</span></span>
                    </div>
                    <div id="pos-detail-list" class="flex flex-wrap gap-2"></div>
                    <div id="pos-summary-info" class="mt-4 pt-3 border-t border-orange-100/50 flex items-center justify-between text-xs text-[#C85A44] font-bold">
                    </div>
                </div>
            </div>
        </div>

        <div id="view-ledger" class="hidden-view space-y-5">
            
            <div class="bg-gradient-to-br from-orange-50 to-amber-50 p-5 rounded-3xl flex justify-between items-center border border-orange-100 shadow-sm opacity-95">
                <div class="flex flex-col">
                    <span class="text-[11px] text-orange-600 font-bold mb-1 tracking-wider flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        總務金庫對帳
                    </span>
                    <span class="text-stone-500 text-xs">應有現金總額 (不分享)</span>
                </div>
                <div class="text-right">
                    <span id="admin-cash-on-hand" class="text-2xl font-black text-orange-500">$0</span>
                </div>
            </div>

            <div class="flex space-x-3 mb-6">
                <button onclick="shareToLine()" class="btn-active w-1/2 bg-white text-[#C85A44] border border-orange-200 py-3.5 rounded-2xl font-bold shadow-sm flex flex-col justify-center items-center hover:bg-orange-50 transition opacity-95">
                    <svg class="w-6 h-6 mb-1 text-[#06C755]" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.3c0-4.3-4.2-7.8-9.4-7.8-5.2 0-9.4 3.5-9.4 7.8 0 3.8 2.6 7 6.3 7.6l1.3.4s-.4 1.4-.4 1.6c-.1.5.3.8.3.8l3.6-2.4 1.3-.9c1.9.1 6.4-2.7 6.4-7.1z"/></svg>
                    <span class="text-xs">分享本日 LINE</span>
                </button>
                <button onclick="exportToExcel()" class="btn-active w-1/2 bg-[#C85A44] text-white py-3.5 rounded-2xl font-bold shadow-md flex flex-col justify-center items-center hover:bg-[#a64835] transition">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="text-xs">下載本月 Excel</span>
                </button>
            </div>

            <div class="glass-panel p-5 rounded-3xl">
                <h3 class="theme-text font-bold text-sm mb-3 flex items-center">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    新增收款作業
                </h3>
                <div class="flex space-x-2">
                    <select id="topup-emp" class="flex-grow bg-white border border-orange-100 rounded-xl px-3 py-2 text-sm outline-none text-stone-700"></select>
                    <input type="number" id="topup-amount" placeholder="金額" class="w-24 bg-white border border-orange-100 rounded-xl px-3 py-2 text-sm outline-none text-stone-700">
                    <button onclick="submitTopup()" class="btn-active bg-[#C85A44] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">收款</button>
                </div>
            </div>

            <div class="glass-panel rounded-3xl overflow-hidden mt-6">
                <div class="bg-orange-50/80 px-4 py-3 border-b border-orange-100">
                    <h3 class="text-xs font-bold theme-text">全體員工餘額表</h3>
                </div>
                <table class="w-full text-left border-collapse">
                    <tbody id="ledger-table" class="divide-y divide-orange-100/50"></tbody>
                </table>
            </div>

            <details class="group bg-white/80 rounded-2xl border border-orange-100 shadow-sm overflow-hidden mt-6 transition-all duration-300">
                <summary class="flex justify-between items-center font-bold cursor-pointer list-none p-4 text-[#4A3E3D] outline-none">
                    <span class="flex items-center text-sm">
                        <svg class="w-4 h-4 mr-2 theme-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        📝 收款歷史紀錄查閱 <span class="text-[10px] text-stone-400 font-normal ml-2">(點擊展開)</span>
                    </span>
                    <span class="transition group-open:rotate-180 text-stone-400"><svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20"><path d="M6 9l6 6 6-6"></path></svg></span>
                </summary>
                <div class="px-4 pb-4 pt-0 text-sm" id="topup-history"></div>
            </details>
        </div>

        <div id="view-settings" class="hidden-view space-y-6">
            <div class="glass-panel p-5 rounded-3xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="font-bold theme-text text-sm flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        員工名單管理 <span class="text-xs text-stone-400 font-normal ml-2">(可調整排序)</span>
                    </h2>
                    <button onclick="addEmployee()" class="text-xs text-[#C85A44] bg-orange-100 hover:bg-orange-200 px-3 py-1.5 rounded-full transition">+ 新增</button>
                </div>
                <div id="setting-employees" class="space-y-2.5"></div>
            </div>

            <div class="glass-panel p-5 rounded-3xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="font-bold theme-text text-sm flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        菜單庫設定
                    </h2>
                    <button onclick="addStore()" class="text-xs text-[#C85A44] bg-orange-100 hover:bg-orange-200 px-3 py-1.5 rounded-full transition">+ 新增店家</button>
                </div>
                <div id="setting-stores" class="space-y-4"></div>
            </div>
        </div>

    </main>

    <div class="fixed bottom-6 left-0 w-full px-5 z-50">
        <nav class="glass-nav rounded-2xl flex justify-around p-2.5 shadow-[0_8px_30px_rgba(100,70,50,0.12)] border border-orange-50">
            <button onclick="switchTab('view-pos')" id="tab-pos" class="flex flex-col items-center p-2 w-1/3 nav-active transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">點餐</span>
            </button>
            <button onclick="switchTab('view-ledger')" id="tab-ledger" class="flex flex-col items-center p-2 w-1/3 nav-inactive transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">存摺與報表</span>
            </button>
            <button onclick="switchTab('view-settings')" id="tab-settings" class="flex flex-col items-center p-2 w-1/3 nav-inactive transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">設定</span>
            </button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCN5T3Wy5M_Ei9JY1kqgc1YzmN4UMufQQw",
          authDomain: "date-ea265.firebaseapp.com",
          projectId: "date-ea265",
          storageBucket: "date-ea265.firebasestorage.app",
          messagingSenderId: "783131275726",
          appId: "1:783131275726:web:a0942ad1560b82e1783b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const fdb = firebase.firestore();

        let appData = { employees: [], stores: [], orders: [], topups: [] };
        let selectedEmps = []; currentCart = []; selectedDate = ""; 

        function getLocalISODate() {
            const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        }

        window.onload = async () => {
            selectedDate = getLocalISODate();
            document.getElementById('order-date').value = selectedDate;
            document.getElementById('display-selected-date').innerText = selectedDate.substring(5);
            
            try {
                await syncSettingsFromCloud(); 
                await syncOrdersFromCloud(); 
                await syncTopupsFromCloud();  
                document.getElementById('loading-overlay').style.display = 'none';
                initStoreSelector();
                renderAll();
            } catch(e) { alert("連線失敗！請檢查網路。"); }
        };

        async function syncSettingsFromCloud() {
            const docRef = fdb.collection("System").doc("Settings");
            const docSnap = await docRef.get();
            if (docSnap.exists) {
                let data = docSnap.data();
                appData.employees = data.employees || [];
                appData.stores = data.stores || [];
            } else {
                appData.employees = [ { name: '王小明', balance: 0 }, { name: '阿迪', balance: 0 } ];
                appData.stores = [ { id: 's1', name: '測試便當店', menu: [{name: '排骨飯', price: 100}] } ];
                await docRef.set({ employees: appData.employees, stores: appData.stores });
            }
        }

        async function syncOrdersFromCloud() {
            const snapshot = await fdb.collection("Orders").where("date", "==", selectedDate).get();
            appData.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        async function syncTopupsFromCloud() {
            const snapshot = await fdb.collection("Topups").orderBy("timestamp", "desc").limit(50).get();
            appData.topups = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        async function saveSettingsToCloud() {
            await fdb.collection("System").doc("Settings").set({
                employees: appData.employees, stores: appData.stores
            });
        }

        async function changeDate() {
            document.getElementById('loading-overlay').style.display = 'flex';
            selectedDate = document.getElementById('order-date').value;
            document.getElementById('display-selected-date').innerText = selectedDate.substring(5);
            selectedEmps = []; currentCart = [];
            await syncOrdersFromCloud(); 
            document.getElementById('loading-overlay').style.display = 'none';
            renderAll();
        }

        function switchTab(viewId) {
            document.querySelectorAll('main > div').forEach(div => { if(div.id.startsWith('view-')) div.classList.add('hidden-view'); });
            document.getElementById(viewId).classList.remove('hidden-view');
            document.querySelectorAll('nav button').forEach(btn => { btn.classList.remove('nav-active'); btn.classList.add('nav-inactive'); });

        function updateCartUI() {
            const btn = document.getElementById('submit-btn');
            const splitInfo = document.getElementById('split-info');
            const toggleDiv = document.getElementById('split-toggle-container');
            const isShared = document.getElementById('is-shared-order').checked;

            else { toggleDiv.classList.add('hidden'); document.getElementById('is-shared-order').checked = false; }

            let cartBaseTotal = currentCart.reduce((sum, item) => sum + item.price, 0);

                        splitInfo.innerText = `☑️ 共食模式：總計 $${cartBaseTotal}，每人扣 $${perPerson}`;
                    } else {

                        splitInfo.innerText = `📦 獨立叫餐：共 ${selectedEmps.length} 份，每人扣 $${cartBaseTotal}`;
                    }
                } else {
                    finalGrandTotal = cartBaseTotal;

                    else splitInfo.innerText = `扣款名單：${selectedEmps[0]}`;

        async function submitCart() {
            let isShared = document.getElementById('is-shared-order').checked && selectedEmps.length > 1;
            let cartBaseTotal = currentCart.reduce((sum, item) => sum + item.price, 0);
            let perPersonAmount = isShared ? Math.round(cartBaseTotal / selectedEmps.length) : cartBaseTotal;
            let foodNames = currentCart.map(item => item.name).join(' + ');
            let note = isShared ? ' (共食)' : '';
            let sharedCount = isShared ? selectedEmps.length : 1;
            
            let backupEmps = [...selectedEmps];
            let backupCart = JSON.parse(JSON.stringify(currentCart));

            backupEmps.forEach(empName => {
                let tempId = 'temp_' + Date.now() + Math.random(); 
                appData.orders.push({ id: tempId, date: selectedDate, empName: empName, food: foodNames + note, price: perPersonAmount, items: backupCart, shared: sharedCount });
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance -= perPersonAmount;
            });
            selectedEmps = []; currentCart = []; renderAll();

            try {
                let writePromises = backupEmps.map(empName => {
                    return fdb.collection("Orders").add({ date: selectedDate, empName: empName, food: foodNames + note, price: perPersonAmount, items: backupCart, shared: sharedCount, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                });
                await Promise.all(writePromises); 
                await saveSettingsToCloud();      
                syncOrdersFromCloud(); 
            } catch(e) {}
        }

        async function cancelOrder(orderId, empName, price) {
            if(confirm(price === 0 ? `要取消 ${empName} 的未點餐紀錄嗎？` : `要將 $${price} 退回給 ${empName} 嗎？`)) {
                const orderIndex = appData.orders.findIndex(o => o.id === orderId);
                if(orderIndex > -1) appData.orders.splice(orderIndex, 1);
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance += price;
                renderAll(); 
                try {
                    if(!orderId.startsWith('temp_')) await fdb.collection("Orders").doc(orderId).delete();
                    await saveSettingsToCloud();
                    syncOrdersFromCloud();
                } catch(e) {}
            }
        }

        async function submitTopup() {
            let empName = document.getElementById('topup-emp').value;
            let amount = parseInt(document.getElementById('topup-amount').value);
            if(!empName) return alert("請選擇收款對象");
            if(isNaN(amount) || amount === 0) return alert("請輸入正確金額");

            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance += amount;
                let now = new Date();
                let timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

                await fdb.collection("Topups").add({ date: getLocalISODate(), time: timeStr, empName: empName, amount: amount, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await saveSettingsToCloud();
                await syncTopupsFromCloud(); 

                document.getElementById('topup-amount').value = ''; 
            } catch(e) { alert("收款紀錄失敗！"); }
            document.getElementById('loading-overlay').style.display = 'none';
            renderAll();
        }

        async function editTopup(id, empName, oldAmount) {
            let newAmountStr = prompt(`修正「${empName}」的這筆收款紀錄：\n請輸入正確的金額：`, oldAmount);
            if (newAmountStr === null) return; 
            
            let newAmount = parseInt(newAmountStr);
            if (isNaN(newAmount) || newAmount === 0) return alert("請輸入正確的數字金額！");
            if (newAmount === oldAmount) return; 

            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                let diff = newAmount - oldAmount;
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance += diff;

                await fdb.collection("Topups").doc(id).update({ amount: newAmount });
                await saveSettingsToCloud();
                await syncTopupsFromCloud();
            } catch(e) { alert("修正紀錄失敗，請檢查網路連線！"); }
            document.getElementById('loading-overlay').style.display = 'none';
            renderAll();
        }

        async function cancelTopup(id, empName, amount) {
            if(confirm(`確定要刪除「${empName} 收款 $${amount}」的紀錄嗎？\n(會將款項從餘額中扣回)`)) {
                document.getElementById('loading-overlay').style.display = 'flex';
                try {
                    let emp = appData.employees.find(e => e.name === empName);
                    if(emp) emp.balance -= amount;
                    await fdb.collection("Topups").doc(id).delete();
                    await saveSettingsToCloud();
                    await syncTopupsFromCloud();
                } catch(e) {}
                document.getElementById('loading-overlay').style.display = 'none';
                renderAll();
            }
        }

        function shareToLine() {
            let text = `🍱 【午餐帳務結算】 ${selectedDate.replace(/-/g, '/')}\n══════════════════\n`;
            let negativeEmps = []; let positiveEmps = [];
            
            appData.employees.forEach(emp => {
                let dailyOrders = appData.orders.filter(o => o.empName === emp.name && o.date === selectedDate);
                let todayOrderInfo = "";
                if (dailyOrders.length > 0) {
                    let foodStr = dailyOrders.map(o => o.food).join(', ');
                    let totalSpent = dailyOrders.reduce((sum, o) => sum + o.price, 0);
                    todayOrderInfo = (foodStr === "未點餐") ? `\n  └ 今日跳過` : `\n  └ 今日: ${foodStr} (-$${totalSpent})`;
                }
                let infoStr = `• ${emp.name}｜`;
                if (emp.balance < 0) negativeEmps.push(`${infoStr}❗需補款 $${Math.abs(emp.balance)}${todayOrderInfo}`);
                else positiveEmps.push(`${infoStr}餘額 $${emp.balance}${todayOrderInfo}`);
            });
            
            if (negativeEmps.length > 0) text += `🔴 需補款名單：\n${negativeEmps.join('\n')}\n\n`;
            if (positiveEmps.length > 0) text += `🟢 餘額充足名單：\n${positiveEmps.join('\n')}\n\n`;
            text += `══════════════════\n💡 請需補款的同事記得找總務喔！`;

            navigator.clipboard.writeText(text).then(() => { alert("✅ 已成功複製！請切換到 LINE 貼上。"); })
            .catch(err => { alert("複製失敗，請手動複製。\n" + text); });
        }

        // ================= ★ Excel 匯出：加入精準逆推演算法 ★ =================
        async function exportToExcel() {
            let currentMonth = getLocalISODate().substring(0,7);
            let targetMonth = prompt("請輸入要匯出的月份 (格式 YYYY-MM)：", currentMonth);
            if(!targetMonth) return;

            const loading = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = "產生報表中...";
            loading.style.display = 'flex';
            
            try {
                // 1. 抓取目標月 1 號開始到「未來」的『所有』紀錄
                let orderSnap = await fdb.collection("Orders").where("date", ">=", targetMonth + "-01").get();
                let topupSnap = await fdb.collection("Topups").where("date", ">=", targetMonth + "-01").get();

                let allFutureOrders = orderSnap.docs.map(doc => doc.data());
                let allFutureTopups = topupSnap.docs.map(doc => doc.data());

                // 2. 過濾出只屬於目標月份的紀錄，用於顯示在 Excel 的網格中
                let monthOrders = allFutureOrders.filter(o => o.date.startsWith(targetMonth));
                let monthTopups = allFutureTopups.filter(t => t.date.startsWith(targetMonth));

                let activeDays = [];
                for(let i=1; i<=31; i++) {
                    let dayStr = targetMonth + "-" + i.toString().padStart(2, '0');
                    if(monthOrders.some(o => o.date === dayStr)) {
                        activeDays.push({ day: i, dateStr: dayStr });
                    }
                }

                const workbook = new ExcelJS.Workbook();
                const sheet = workbook.addWorksheet('本月午餐結算');

                let columns = [
                    { header: '員工姓名', key: 'name', width: 14 },
                    { header: '上月結存', key: 'lastMonthBal', width: 12 }, // <--- 新增欄位
                    { header: '系統目前餘額', key: 'balance', width: 16 },
                    { header: '本月總儲值', key: 'topup', width: 15 },
                    { header: '本月餐費總計', key: 'spend', width: 16 }
                ];
                activeDays.forEach(d => {
                    columns.push({ header: d.day + '號', key: 'd' + d.day, width: 6 });
                });
                sheet.columns = columns;

                sheet.getRow(1).eachCell(cell => {
                    cell.font = { bold: true };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFCE7F3' } }; 
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                });

                appData.employees.forEach(emp => {
                    
                    // --- 核心：時光機逆推法算「上月結存」 ---
                    // 找出這個員工從「目標月 1 號」起到現在的每一筆儲值與花費
                    let empFutureOrders = allFutureOrders.filter(o => o.empName === emp.name);
                    let empFutureTopups = allFutureTopups.filter(t => t.empName === emp.name);
                    
                    let futureSpendTotal = empFutureOrders.reduce((sum, o) => sum + o.price, 0);
                    let futureTopupTotal = empFutureTopups.reduce((sum, t) => sum + t.amount, 0);
                    
                    // 上月結存 = 目前餘額 - 之後加進來的錢(Topup) + 之後花掉的錢(Spend)
                    let lastMonthBalance = emp.balance - futureTopupTotal + futureSpendTotal;
                    // ----------------------------------------

                    let empOrders = monthOrders.filter(o => o.empName === emp.name);
                    let empTopups = monthTopups.filter(t => t.empName === emp.name);

                    let totalSpend = empOrders.reduce((sum, o) => sum + o.price, 0);
                    let totalTopup = empTopups.reduce((sum, t) => sum + t.amount, 0);
                    let spendVal = totalSpend > 0 ? -totalSpend : 0; 
                    
                    let rowData = {
                        name: emp.name,
                        lastMonthBal: lastMonthBalance, // 寫入計算結果
                        balance: emp.balance,
                        topup: totalTopup > 0 ? totalTopup : '',
                        spend: spendVal !== 0 ? spendVal : ''
                    };

                    activeDays.forEach(d => {
                        let dailyOrders = empOrders.filter(o => o.date === d.dateStr);
                        let dailySpend = dailyOrders.reduce((sum, o) => sum + o.price, 0);
                        rowData['d' + d.day] = dailySpend > 0 ? -dailySpend : '';
                    });

                    let row = sheet.addRow(rowData);

                    row.eachCell((cell, colNumber) => {
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        if (typeof cell.value === 'number' && cell.value < 0) {
                            cell.font = { color: { argb: 'FFFF0000' } };
                        }
                    });
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = `午餐結算總表_${targetMonth}.xlsx`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch(e) {
                alert("報表產生失敗，請檢查網路連線");
                console.error(e);
            }
            loading.style.display = 'none';
            document.getElementById('loading-text').innerText = "系統連線中...";
        }

                        <div class="flex items-center">
                            <div class="flex flex-col mr-3 space-y-1">
                                <button onclick="moveEmpUp(${i})" class="text-[10px] bg-stone-100 text-stone-500 rounded px-1.5 hover:bg-orange-100 hover:text-[#C85A44] ${i === 0 ? 'opacity-0 pointer-events-none' : ''} transition">▲</button>
                                <button onclick="moveEmpDown(${i})" class="text-[10px] bg-stone-100 text-stone-500 rounded px-1.5 hover:bg-orange-100 hover:text-[#C85A44] ${i === appData.employees.length - 1 ? 'opacity-0 pointer-events-none' : ''} transition">▼</button>
                            </div>
                            <span class="font-bold text-sm text-[#4A3E3D]">${emp.name}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-sm font-black ${balColor}">$${emp.balance}</span>
                            <div class="flex space-x-1.5">
                                <button onclick="editEmpBalance(${i})" class="text-xs bg-orange-50 hover:bg-orange-100 text-[#C85A44] font-medium px-3 py-1.5 rounded-lg transition">更正</button>
                                <button onclick="deleteEmployee(${i})" class="text-xs bg-red-50 hover:bg-red-100 text-red-500 font-medium px-3 py-1.5 rounded-lg transition">刪除</button>
                            </div>
                        </div>
                    </div>`;
            });

            const storeContainer = document.getElementById('setting-stores');
            storeContainer.innerHTML = '';
            appData.stores.forEach((store, sIdx) => {
                let html = `
                    <div class="bg-white/80 p-4 rounded-3xl border border-orange-100 shadow-sm">
                        <div class="flex justify-between items-center mb-3 border-b border-orange-50 pb-3">
                            <span class="font-bold text-sm text-[#4A3E3D] flex items-center">
                                <svg class="w-4 h-4 mr-1.5 theme-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                ${store.name}
                            </span>
                            <div class="flex space-x-2">
                                <button onclick="addMenuItem(${sIdx})" class="text-xs text-[#C85A44] font-bold bg-orange-50 px-2.5 py-1 rounded-md">+ 餐點</button>
                                <button onclick="deleteStore(${sIdx})" class="text-xs text-red-500 font-bold bg-red-50 px-2.5 py-1 rounded-md">刪店家</button>
                            </div>
                        </div>
                        <div class="space-y-2.5">`;
                store.menu.forEach((item, mIdx) => {
                    html += `
                        <div class="flex justify-between items-center pl-1">
                            <span class="text-sm text-stone-500 font-medium">${item.name}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm theme-text font-bold mr-1">$${item.price}</span>
                                <button onclick="editMenuPrice(${sIdx}, ${mIdx})" class="text-[10px] bg-stone-100 text-stone-500 font-medium px-2 py-1 rounded transition">改價</button>
                                <button onclick="deleteMenuItem(${sIdx}, ${mIdx})" class="text-[10px] bg-red-50 text-red-500 font-medium px-2 py-1 rounded transition">刪除</button>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
                storeContainer.innerHTML += html;
            });
        }

        function addEmployee() { let name = prompt("請輸入新同事姓名："); if(name) updateSettingsAction(() => appData.employees.push({name: name, balance: 0})); }
        function editEmpBalance(index) { let emp = appData.employees[index]; let newBal = prompt(`請輸入 ${emp.name} 的正確餘額：\n(若要記錄繳款，請至存摺頁面使用「新增收款作業」)`, emp.balance); if(newBal !== null && !isNaN(newBal)) updateSettingsAction(() => emp.balance = parseInt(newBal)); }
        function deleteEmployee(index) { if(confirm(`確定要刪除「${appData.employees[index].name}」嗎？`)) updateSettingsAction(() => appData.employees.splice(index, 1)); }
        function addStore() { let name = prompt("請輸入新店家名稱："); if(name) updateSettingsAction(() => { appData.stores.push({id: 's'+Date.now(), name: name, menu: []}); initStoreSelector(); }); }
        function deleteStore(storeIndex) { if(confirm(`確定要刪除「${appData.stores[storeIndex].name}」嗎？`)) updateSettingsAction(() => { appData.stores.splice(storeIndex, 1); initStoreSelector(); }); }
        function addMenuItem(storeIndex) { let name = prompt("請輸入餐點："); if(!name) return; let price = prompt(`價格：`); if(price !== null && !isNaN(price)) updateSettingsAction(() => appData.stores[storeIndex].menu.push({name: name, price: parseInt(price)})); }
        function editMenuPrice(storeIndex, menuIndex) { let item = appData.stores[storeIndex].menu[menuIndex]; let newPrice = prompt(`「${item.name}」新價格：`, item.price); if(newPrice !== null && !isNaN(newPrice)) updateSettingsAction(() => item.price = parseInt(newPrice)); }
        function deleteMenuItem(storeIndex, menuIndex) { if(confirm(`刪除「${appData.stores[storeIndex].menu[menuIndex].name}」？`)) updateSettingsAction(() => appData.stores[storeIndex].menu.splice(menuIndex, 1)); }
    </script>
</body>
</html>
