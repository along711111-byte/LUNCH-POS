    <style>
        body {

            background-color: #FDF9F5; 
            background-image: url('Gemini_Generated_Image_unma06unma06unma.png'); 
            background-size: cover;

            background-attachment: fixed;

        .theme-gradient { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%); }
        .theme-text { color: #C85A44; }
        
        .emp-selected { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%) !important; color: white !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(200, 90, 68, 0.3); transform: translateY(-1px); font-weight: 700; }
        .btn-active:active { transform: scale(0.97); }
        
        .nav-active { color: #C85A44; }
        .nav-inactive { color: #B0A09A; }
        
        input[type=checkbox] { accent-color: #C85A44; width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; border: 1px solid #e5e7eb; }

        details > summary::-webkit-details-marker { display: none; }
        
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); } 
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        #loading-overlay { position: fixed; inset: 0; background: rgba(253, 249, 245, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #C85A44; text-align: center; }

        @keyframes bounce-in { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .anim-bubble { animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.3s; opacity: 0; }
        
        @keyframes slide-up-char { 0% { transform: translateY(100px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCN5T3Wy5M_Ei9JY1kqgc1YzmN4UMufQQw", authDomain: "date-ea265.firebaseapp.com", projectId: "date-ea265", storageBucket: "date-ea265.firebasestorage.app", messagingSenderId: "783131275726", appId: "1:783131275726:web:a0942ad1560b82e1783b9f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let appData = { employees: [], stores: [], orders: [], topups: [] };
        let selectedDate = new Date().toISOString().split('T')[0];
        let currentSelectedStoreId = '';
        let selectedEmployeesForCart = new Set();
        let currentCartItems = [];
        let hasShownHelperToday = false; 
        
        // 【修正重點】宣告全域取消訂閱的變數，防止監聽器疊加爆量
        let unsubOrders = null;
        let unsubTopups = null;

        function formatPrice(num) {
            if (num === undefined || num === null || isNaN(num)) return "0";
            return num % 1 === 0 ? num.toString() : parseFloat(num.toFixed(1)).toString();
        }

        async function init() {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            selectedDate = d.toISOString().split('T')[0];
            
            document.getElementById('order-date').value = selectedDate;
            document.getElementById('topup-date').value = selectedDate; 
            document.getElementById('display-selected-date').innerText = selectedDate.replace(/-/g, '/');
            
            db.collection("System").doc("Settings").onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    appData.employees = data.employees || [];
                    appData.stores = data.stores || [];
                    renderStoreSelector();
                    renderSettings();
                    renderAll(); // 單純重新渲染，不再重複呼叫監聽器
                }
                document.getElementById('global-loading').classList.add('hidden');
            });
            
            // 【修正重點】獨立於 Settings 之外，只在初始化與換日期時呼叫一次
            loadDailyOrdersAndTopups();
        }

        function loadDailyOrdersAndTopups() {
            // 切換日期或重新讀取時，先清空先前的監聽器，避免無限繁殖
            if (unsubOrders) unsubOrders();
            if (unsubTopups) unsubTopups();
            
            unsubOrders = db.collection("Orders").where("date", "==", selectedDate).onSnapshot(snapshot => {
                appData.orders = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                renderAll();
            });

            unsubTopups = db.collection("Topups").orderBy("timestamp", "desc").onSnapshot(tSnapshot => {
                appData.topups = tSnapshot.docs.map(d => ({id: d.id, ...d.data()}));
                renderAll();
            });
        }

        function renderStoreSelector() {
            const selector = document.getElementById('store-selector');
            const previousValue = selector.value;
            selector.innerHTML = '';
            appData.stores.forEach(store => {
                selector.innerHTML += `<option value="${store.id}">選擇店家：${store.name}</option>`;
            });
            if (previousValue && appData.stores.some(s => s.id === previousValue)) {
                selector.value = previousValue;
            } else if (appData.stores.length > 0) {
                selector.value = appData.stores[0].id;
            }
            currentSelectedStoreId = selector.value;
        }

        function changeDate() {
            selectedDate = document.getElementById('order-date').value;
            document.getElementById('display-selected-date').innerText = selectedDate.replace(/-/g, '/');
            document.getElementById('topup-date').value = selectedDate; 
            selectedEmployeesForCart.clear();
            currentCartItems = [];
            hasShownHelperToday = false; 
            updateCartInfo();
            // 換日期時，重新掛載對應日期的監聽器
            loadDailyOrdersAndTopups();
        }

        function changeStore() {
            currentSelectedStoreId = document.getElementById('store-selector').value;
            renderMenu();
        }

        function renderAll() {
            renderPendingEmployees();
            renderMenu();
            renderCompletedOrders();
            renderLedger();
            renderTopupSelect();
            renderTopupHistory();
            checkAutoHelper(); 
        }

        function renderPendingEmployees() {
            const empContainer = document.getElementById('pending-employees');
            empContainer.innerHTML = '';
            const orderedEmpNames = new Set(appData.orders.map(o => o.empName));
            const pendingEmps = appData.employees.filter(emp => !orderedEmpNames.has(emp.name));

            pendingEmps.forEach(emp => {
                const isSelected = selectedEmployeesForCart.has(emp.name);
                const btnClass = isSelected ? 'emp-selected' : 'bg-white/60 text-[#4A3E3D] border-orange-100 hover:border-orange-300 backdrop-blur-xs';
                empContainer.innerHTML += `<button onclick="toggleEmp('${emp.name}')" class="btn-active py-3 border rounded-xl transition font-medium text-sm ${btnClass} truncate px-1 shadow-sm">${emp.name}</button>`;
            });

            if (pendingEmps.length === 0) { empContainer.innerHTML = '<p class="text-xs text-stone-500 col-span-3 text-center py-2 flex justify-center items-center">✅ 所有同事皆已處理</p>'; }
        }

        function toggleEmp(empName) {
            if (selectedEmployeesForCart.has(empName)) { selectedEmployeesForCart.delete(empName); } else { selectedEmployeesForCart.add(empName); }
            updateCartInfo();
            renderPendingEmployees();
        }

        function renderMenu() {
            const menuContainer = document.getElementById('current-menu');
            menuContainer.innerHTML = '';
            const store = appData.stores.find(s => s.id === currentSelectedStoreId);
            if (!store || !store.menu) return;

            store.menu.forEach(item => {
                const count = currentCartItems.filter(i => i.name === item.name).length;
                const isSelected = count > 0;
                const activeClass = isSelected ? 'border-[#C85A44] bg-orange-50/40' : 'border-stone-200/40 bg-white/50';
                const titleClass = isSelected ? 'theme-text' : 'text-[#4A3E3D]';
                const priceClass = 'theme-text';

                menuContainer.innerHTML += `
                    <button onclick="toggleCartItem('${item.name}', ${item.price})" class="btn-active p-3.5 rounded-xl border text-left flex flex-col justify-between transition relative overflow-hidden h-[76px] shadow-xs backdrop-blur-xs ${activeClass}">
                        ${count > 0 ? `<span class="absolute top-0 right-0 bg-[#C85A44] text-white text-[10px] font-black px-2 py-0.5 rounded-bl-xl shadow-xs">x${count}</span>` : ''}
                        <span class="font-bold text-sm truncate ${titleClass}">${item.name}</span>
                        <span class="font-bold mt-1 text-sm ${priceClass}">$${formatPrice(item.price)}</span>
                    </button>`;
            });
        }

        function toggleCartItem(foodName, price) {
            if (foodName === '未點餐') {
                if (selectedEmployeesForCart.size === 0) { alert('請先在上方選擇要登記「未點餐」的同仁！'); return; }
                currentCartItems = [{ name: '未點餐', price: 0 }];
                submitCart(); return;
            }
            if (selectedEmployeesForCart.size === 0) { alert('請先在上方選擇點餐對象，再點選餐點項目！'); return; }

            const index = currentCartItems.findIndex(i => i.name === foodName);
            if (index > -1) { currentCartItems.splice(index, 1); } else { currentCartItems.push({ name: foodName, price: price }); }
            updateCartInfo(); renderMenu();
        }

        function updateCartInfo() {
            const previewBox = document.getElementById('cart-preview-box');
            const itemsList = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('cart-total');
            const isShared = document.getElementById('cart-is-shared').checked;

            if (currentCartItems.length === 0 || selectedEmployeesForCart.size === 0) { previewBox.classList.add('hidden'); return; }
            previewBox.classList.remove('hidden');

            let cartBaseTotal = currentCartItems.reduce((sum, item) => sum + item.price, 0);
            let perPersonAmount = isShared ? (cartBaseTotal / selectedEmployeesForCart.size) : cartBaseTotal;

            itemsList.innerHTML = `<div class="flex justify-between items-center text-xs text-orange-100 font-bold bg-white/10 px-2 py-1 rounded-md mb-1.5"><span>對象: ${Array.from(selectedEmployeesForCart).join(', ')}</span><span>共 ${selectedEmployeesForCart.size} 人</span></div>`;
            currentCartItems.forEach(item => { itemsList.innerHTML += `<div class="flex justify-between"><span>• ${item.name}</span><span>$${formatPrice(item.price)}</span></div>`; });

            if (isShared) { totalSpan.innerHTML = `$${formatPrice(perPersonAmount)} <span class="text-xs font-normal text-orange-100">/人 (👥共食拆帳)</span>`; } 
            else { totalSpan.innerHTML = `$${formatPrice(cartBaseTotal)} <span class="text-xs font-normal text-orange-100">/人</span>`; }
        }

        async function submitCart() {
            if (selectedEmployeesForCart.size === 0 || currentCartItems.length === 0) return;
            document.getElementById('global-loading').classList.remove('hidden');

            try {
                const isShared = document.getElementById('cart-is-shared').checked;
                let cartBaseTotal = currentCartItems.reduce((sum, item) => sum + item.price, 0);
                let perPersonAmount = isShared ? (cartBaseTotal / selectedEmployeesForCart.size) : cartBaseTotal;

                const batch = db.batch();
                const foodNames = currentCartItems.map(i => i.name).join('+');
                const sharedCount = isShared ? selectedEmployeesForCart.size : 1;

                for (let empName of selectedEmployeesForCart) {
                    const orderRef = db.collection("Orders").doc();
                    batch.set(orderRef, { date: selectedDate, empName: empName, food: foodNames, price: perPersonAmount, shared: sharedCount, timestamp: firebase.firestore.FieldValue.serverTimestamp() });

                    const empIdx = appData.employees.findIndex(e => e.name === empName);
                    if (empIdx > -1) { appData.employees[empIdx].balance -= perPersonAmount; }
                }

                batch.update(db.collection("System").doc("Settings"), { employees: appData.employees });
                await batch.commit();

                selectedEmployeesForCart.clear(); currentCartItems = []; document.getElementById('cart-is-shared').checked = false;
                updateCartInfo(); renderAll();
            } finally {
                // 【修正重點】使用 finally 確保不管成功或斷線，讀取畫面絕對會關閉
                document.getElementById('global-loading').classList.add('hidden');
            }
        }

        function renderCompletedOrders() {
            const orderContainer = document.getElementById('completed-orders');
            const detailContainer = document.getElementById('pos-detail-list');
            orderContainer.innerHTML = ''; detailContainer.innerHTML = '';

            let totalAmount = 0; let orderingEmps = new Set(); let sharedEmps = new Set();

            if (appData.orders.length === 0) {
                orderContainer.innerHTML = '<div class="text-center py-5"><span class="text-xs text-stone-400">目前尚無明細</span></div>';
                document.getElementById('pos-today-total').innerText = '$0';
                document.getElementById('pos-summary-info').classList.add('hidden'); return;
            }

            appData.orders.sort((a, b) => (a.food === '未點餐' ? 1 : 0) - (b.food === '未點餐' ? 1 : 0));
            let itemCounts = {};

            appData.orders.forEach(order => {
                totalAmount += order.price;
                if (order.food !== "未點餐") {
                    orderingEmps.add(order.empName);
                    if (order.shared > 1) sharedEmps.add(order.empName);
                    order.food.split('+').forEach(itemName => { if (!itemCounts[itemName]) itemCounts[itemName] = 0; itemCounts[itemName] += (1 / order.shared); });
                }

                const isSkip = order.food === "未點餐";
                const cardBg = isSkip ? 'bg-stone-100/40 opacity-60' : 'bg-white/55';
                const foodClass = isSkip ? 'text-stone-400 font-normal' : 'text-stone-500 font-medium';

                orderContainer.innerHTML += `
                    <div class="flex justify-between items-center p-3.5 rounded-2xl border border-orange-50/50 shadow-sm backdrop-blur-xs ${cardBg}">
                        <div class="w-2/3">
                            <span class="font-bold text-[#4A3E3D] text-sm block mb-0.5">${order.empName}</span>
                            <span class="text-xs ${foodClass} truncate block w-full">${order.food} ${order.shared > 1 ? `👥(共食拆 ${order.shared} 人)` : ''}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            ${!isSkip ? `<span class="font-bold theme-text text-sm">$${formatPrice(order.price)}</span>` : ''}
                            <button onclick="cancelOrder('${order.id}', '${order.empName}', ${order.price})" class="text-orange-500 bg-orange-50 hover:bg-orange-100 px-3 py-1.5 rounded-lg text-xs font-medium transition">退單</button>
                        </div>
                    </div>`;
            });

            document.getElementById('pos-today-total').innerText = `$${formatPrice(totalAmount)}`;

            for (let itemName in itemCounts) {
                const count = parseFloat(itemCounts[itemName].toFixed(1));
                detailContainer.innerHTML += `<div class="bg-orange-50/60 border border-orange-100 text-[#C85A44] text-xs font-bold px-3 py-2 rounded-xl flex items-center shadow-xs backdrop-blur-xs"><span class="mr-2">${itemName}</span><span class="bg-white/80 text-orange-500 px-1.5 py-0.5 rounded-md text-[10px] shadow-xs">x ${formatPrice(count)}</span></div>`;
            }

            const infoPanel = document.getElementById('pos-summary-info');
            const pendingEmpsCount = appData.employees.filter(emp => !new Set(appData.orders.map(o => o.empName)).has(emp.name)).length;
            if (pendingEmpsCount === 0) {
                infoPanel.classList.remove('hidden');
                document.getElementById('reminder-text').innerText = `💡 溫馨提醒：共 ${orderingEmps.size} 人點餐，${sharedEmps.size} 人共食。全數處理完畢！`;
            } else { infoPanel.classList.add('hidden'); }
        }

        function checkAutoHelper() {
            const orderedEmpNames = new Set(appData.orders.map(o => o.empName));
            const pendingEmpsCount = appData.employees.filter(emp => !orderedEmpNames.has(emp.name)).length;
            if (appData.orders.length > 0 && pendingEmpsCount === 0 && !hasShownHelperToday) {
                hasShownHelperToday = true; 
                setTimeout(() => { showQAnimation(false); }, 600);
            }
        }

        async function cancelOrder(orderId, empName, price) {
            if (confirm(price === 0 ? `要取消 ${empName} 的未點餐紀錄嗎？` : `要將 $${formatPrice(price)} 退回給 ${empName} 嗎？`)) {
                document.getElementById('global-loading').classList.remove('hidden');
                try {
                    const batch = db.batch();
                    batch.delete(db.collection("Orders").doc(orderId));
                    const empIdx = appData.employees.findIndex(e => e.name === empName);
                    if (empIdx > -1) { appData.employees[empIdx].balance += price; }
                    batch.update(db.collection("System").doc("Settings"), { employees: appData.employees });
                    await batch.commit(); renderAll();
                } finally {
                    document.getElementById('global-loading').classList.add('hidden');
                }
            }
        }

        function renderLedger() {
            const tbody = document.getElementById('ledger-table');
            tbody.innerHTML = ''; let totalCash = 0;
            let sortedEmps = [...appData.employees].sort((a, b) => a.balance - b.balance);

            sortedEmps.forEach(emp => {
                totalCash += emp.balance;
                const balanceColor = emp.balance < 0 ? 'text-red-500 font-bold' : 'text-green-600 font-bold';
                const balanceText = emp.balance < 0 ? `-$${formatPrice(Math.abs(emp.balance))}` : `$${formatPrice(emp.balance)}`;
                tbody.innerHTML += `
                    <tr class="hover:bg-orange-50/50 transition border-b border-orange-100/30 last:border-0 relative z-10">
                        <td class="p-4 font-bold text-[#4A3E3D]">${emp.name}</td>
                        <td class="p-4 text-right font-black ${balanceColor}">${balanceText}</td>
                    </tr>`;
            });
            document.getElementById('admin-cash-on-hand').innerText = `$${formatPrice(totalCash)}`;
        }

        function renderTopupSelect() {
            const topupSelect = document.getElementById('topup-emp');
            topupSelect.innerHTML = '<option value="">選擇員工...</option>';
            appData.employees.forEach(emp => { topupSelect.innerHTML += `<option value="${emp.name}">${emp.name}</option>`; });
        }

        async function submitTopup() {
            const empName = document.getElementById('topup-emp').value;
            const amountStr = document.getElementById('topup-amount').value;
            const customDate = document.getElementById('topup-date').value; 
            
            if (!empName || !amountStr || !customDate) { alert('請填妥員工、日期與收款金額！'); return; }

            const amount = parseFloat(amountStr);
            document.getElementById('global-loading').classList.remove('hidden');

            try {
                const batch = db.batch();
                const topupRef = db.collection("Topups").doc();
                const now = new Date();
                
                const localDate = customDate;

                batch.set(topupRef, {
                    empName: empName,
                    amount: amount,
                    date: localDate,
                    time: now.toTimeString().substring(0, 5),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                const empIdx = appData.employees.findIndex(e => e.name === empName);
                if (empIdx > -1) { appData.employees[empIdx].balance += amount; }
                batch.update(db.collection("System").doc("Settings"), { employees: appData.employees });

                await batch.commit();
                document.getElementById('topup-amount').value = '';
                renderAll();
            } finally {
                document.getElementById('global-loading').classList.add('hidden');
            }
        }

        function renderTopupHistory() {
            const historyContainer = document.getElementById('topup-history');
            historyContainer.innerHTML = '';
            if (appData.topups.length === 0) { historyContainer.innerHTML = '<p class="text-xs text-stone-400 text-center py-4">尚無收款紀錄</p>'; return; }

            let grouped = {};
            appData.topups.forEach(t => { let month = t.date.substring(0, 7); if (!grouped[month]) grouped[month] = []; grouped[month].push(t); });

            for (let month in grouped) {
                let monthHtml = `<div class="mb-4 last:mb-0 relative z-10"><h4 class="text-xs font-bold text-[#C85A44] mb-2 border-b border-orange-100/40 pb-1 ml-1">${month}</h4><div class="space-y-2">`;
                grouped[month].forEach(t => {
                    monthHtml += `
                        <div class="flex justify-between items-center bg-orange-50/40 p-2.5 rounded-xl border border-orange-100/40 backdrop-blur-xs">
                            <div>
                                <span class="font-bold text-sm text-[#4A3E3D] mr-2">${t.empName}</span>
                                <span class="text-[10px] text-stone-400">${t.date.substring(5)} ${t.time}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm font-black text-green-600 mr-1.5">+$${formatPrice(t.amount)}</span>
                                <button onclick="editTopup('${t.id}', '${t.empName}', ${t.amount})" class="text-stone-500 hover:text-[#C85A44] text-[11px] font-medium transition px-2 py-1 bg-white/70 rounded shadow-sm backdrop-blur-xs">修正</button>
                                <button onclick="cancelTopup('${t.id}', '${t.empName}', ${t.amount})" class="text-stone-500 hover:text-red-500 text-[11px] font-medium transition px-2 py-1 bg-white/70 rounded shadow-sm backdrop-blur-xs">刪除</button>
                            </div>
                        </div>`;
                });
                monthHtml += `</div></div>`;
                historyContainer.innerHTML += monthHtml;
            }
        }

        async function editTopup(id, empName, oldAmount) {
            const newAmountStr = prompt(`修改「${empName}」的收款金額：`, oldAmount);
            if (newAmountStr === null || isNaN(newAmountStr) || newAmountStr === '') return;
            const newAmount = parseFloat(newAmountStr);

            document.getElementById('global-loading').classList.remove('hidden');
            try {
                const batch = db.batch();
                batch.update(db.collection("Topups").doc(id), { amount: newAmount });

                const empIdx = appData.employees.findIndex(e => e.name === empName);
                if (empIdx > -1) { appData.employees[empIdx].balance = appData.employees[empIdx].balance - oldAmount + newAmount; }
                batch.update(db.collection("System").doc("Settings"), { employees: appData.employees });

                await batch.commit(); renderAll();
            } finally {
                document.getElementById('global-loading').classList.add('hidden');
            }
        }

        async function cancelTopup(id, empName, amount) {
            if (confirm(`確定要刪除「${empName}」這筆 $${formatPrice(amount)} 的收款紀錄嗎？(員工餘額將會被扣回)`)) {
                document.getElementById('global-loading').classList.remove('hidden');
                try {
                    const batch = db.batch();
                    batch.delete(db.collection("Topups").doc(id));
                    const empIdx = appData.employees.findIndex(e => e.name === empName);
                    if (empIdx > -1) { appData.employees[empIdx].balance -= amount; }
                    batch.update(db.collection("System").doc("Settings"), { employees: appData.employees });
                    await batch.commit(); renderAll();
                } finally {
                    document.getElementById('global-loading').classList.add('hidden');
                }
            }
        }

        async function exportToExcel() {
            let currentMonthStr = selectedDate.substring(0,7);
            let targetMonth = prompt("請輸入要匯出的月份 (格式 YYYY-MM)：", currentMonthStr);
            if(!targetMonth) return;

            document.getElementById('global-loading').classList.remove('hidden');
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('當月對帳總表');
            const daysInMonth = new Date(targetMonth.substring(0,4), targetMonth.substring(5,7), 0).getDate();

            try {
                const ordersSnapshot = await db.collection("Orders").get();
                const allOrders = ordersSnapshot.docs.map(d => d.data());
                const topupsSnapshot = await db.collection("Topups").get();
                const allTopups = topupsSnapshot.docs.map(d => d.data());

                const monthOrders = allOrders.filter(o => o.date && o.date.startsWith(targetMonth));
                const monthTopups = allTopups.filter(t => t.date && t.date.startsWith(targetMonth));

                let activeDays = [];
                for(let d=1; d<=daysInMonth; d++) {
                    const dateStr = `${targetMonth}-${String(d).padStart(2, '0')}`;
                    const dailyTotalSpent = monthOrders.filter(o => o.date === dateStr).reduce((sum, o) => sum + (Number(o.price) || 0), 0);
                    if (dailyTotalSpent > 0) { activeDays.push(d); }
                }

                let columns = [
                    { header: '員工姓名', key: 'name', width: 14 },
                    { header: '上月結存', key: 'lastMonthBal', width: 12 }, 
                    { header: '本月總儲值', key: 'topup', width: 15 },
                    { header: '本月餐費總計', key: 'spend', width: 16 },
                    { header: '尚存餘額', key: 'currentMonthBal', width: 16 }
                ];
                activeDays.forEach(d => { columns.push({ header: d + '號', key: 'd' + d, width: 6 }); });
                sheet.columns = columns;

                sheet.getRow(1).eachCell(cell => {
                    cell.font = { bold: true };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFCE7F3' } }; 
                    cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                });

                appData.employees.forEach(emp => {
                    const priorOrders = allOrders.filter(o => o.empName === emp.name && o.date < `${targetMonth}-01`);
                    const priorOrdersSpent = priorOrders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
                    const priorTopups = allTopups.filter(t => t.empName === emp.name && t.date < `${targetMonth}-01`);
                    const priorTopupsReceived = priorTopups.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                    const lastMonthBalance = priorTopupsReceived - priorOrdersSpent;

                    const empMonthOrders = monthOrders.filter(o => o.empName === emp.name);
                    const empMonthTopups = monthTopups.filter(t => t.empName === emp.name);
                    
                    const totalSpend = empMonthOrders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
                    const totalTopup = empMonthTopups.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
                    const spendVal = totalSpend > 0 ? -totalSpend : 0; 
                    const currentMonthEndBalance = lastMonthBalance + totalTopup - totalSpend;

                    let rowData = {
                        name: emp.name,
                        lastMonthBal: lastMonthBalance % 1 === 0 ? lastMonthBalance : Number(lastMonthBalance.toFixed(1)), 
                        topup: totalTopup > 0 ? (totalTopup % 1 === 0 ? totalTopup : Number(totalTopup.toFixed(1))) : '',
                        spend: spendVal !== 0 ? (spendVal % 1 === 0 ? spendVal : Number(spendVal.toFixed(1))) : '',
                        currentMonthBal: currentMonthEndBalance % 1 === 0 ? currentMonthEndBalance : Number(currentMonthEndBalance.toFixed(1))
                    };

                    activeDays.forEach(d => {
                        const dateStr = `${targetMonth}-${String(d).padStart(2, '0')}`;
                        const dailyOrders = empMonthOrders.filter(o => o.date === dateStr);
                        const dailySpend = dailyOrders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
                        rowData['d' + d] = dailySpend > 0 ? (-dailySpend % 1 === 0 ? -dailySpend : Number((-dailySpend).toFixed(1))) : '';
                    });

                    let row = sheet.addRow(rowData);
                    row.eachCell((cell, colNumber) => {
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                        cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        if (typeof cell.value === 'number' && cell.value < 0) { cell.font = { color: { argb: 'FFFF0000' } }; }
                    });
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `午餐結算總表_${targetMonth}.xlsx`;
                link.click();
            } catch(e) { alert("報表產生失敗，請檢查網路連線"); console.error(e); }
            document.getElementById('global-loading').classList.add('hidden');
        }

        function shareToLine() {
            let text = `🍱 【午餐帳務結算】 ${selectedDate.replace(/-/g, '/')}
══════════════════
`;
            let itemCounts = {}; let totalAmount = 0;
            appData.orders.forEach(order => {
                if (order.food !== "未點餐") {
                    totalAmount += order.price;
                    text += `👤 ${order.empName}：${order.food} [$${formatPrice(order.price)}]\n`;
                    order.food.split('+').forEach(itemName => { if (!itemCounts[itemName]) itemCounts[itemName] = 0; itemCounts[itemName] += (1 / order.shared); });
                } else { text += `👤 ${order.empName}：本日未點餐 💤\n`; }
            });
            text += `══════════════════\n📊 【便當預訂總統計組數】\n`;
            for (let itemName in itemCounts) { text += `▪️ ${itemName} × ${formatPrice(itemCounts[itemName])} 份\n`; }
            text += `══════════════════\n💰 今日現金總計：$${formatPrice(totalAmount)} 元`;
            window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`);
        }

        function showQAnimation(isManualClick = false) {
            const orderedEmpNames = new Set(appData.orders.map(o => o.empName));
            const pendingEmpsCount = appData.employees.filter(emp => !orderedEmpNames.has(emp.name)).length;
            let speech = pendingEmpsCount > 0 ? `老闆！還有 ${pendingEmpsCount} 位員工還沒決定午餐喔！快催催他們～` : (isManualClick ? ["太棒了！今天所有同仁的午餐都已經完美登錄完畢囉！✨", "點餐收單！別忘了打電話跟便當店訂餐喔～📞", "大功告成！今天大家都有飯吃了，小幫手祝您用餐愉快！🍱"][Math.floor(Math.random() * 3)] : "太棒了！今天所有同仁的午餐都已經完美登錄完畢囉！✨");
            document.getElementById('q-speech-text').innerText = speech;
            document.getElementById('q-animation-overlay').classList.remove('hidden');
        }

        function closeQAnimation() { document.getElementById('q-animation-overlay').classList.add('hidden'); }

        function switchTab(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden-view'));
            document.getElementById(viewId).classList.remove('hidden-view');
            document.querySelectorAll('nav button').forEach(b => { b.classList.remove('nav-active'); b.classList.add('nav-inactive'); });
            if(viewId === 'view-pos') document.getElementById('tab-pos').className = document.getElementById('tab-pos').className.replace('nav-inactive', 'nav-active');
            if(viewId === 'view-ledger') document.getElementById('tab-ledger').className = document.getElementById('tab-ledger').className.replace('nav-inactive', 'nav-active');
            if(viewId === 'view-settings') document.getElementById('tab-settings').className = document.getElementById('tab-settings').className.replace('nav-inactive', 'nav-active');
        }

        function renderSettings() {
            const empSettingContainer = document.getElementById('setting-employees');
            empSettingContainer.innerHTML = '';
            appData.employees.forEach((emp, i) => {
                const balColor = emp.balance < 0 ? 'text-red-500' : 'text-green-600';
                empSettingContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white/55 p-3.5 rounded-2xl border border-orange-100/40 shadow-sm relative backdrop-blur-xs">
                        <div class="flex items-center space-x-2">
                            <div class="flex flex-col space-y-1">
                                <button onclick="moveEmpUp(${i})" class="text-[10px] bg-white/70 text-stone-500 rounded px-1.5 hover:bg-orange-100 hover:text-[#C85A44] ${i === 0 ? 'opacity-0 pointer-events-none' : ''} transition shadow-xs backdrop-blur-xs">▲</button>
                                <button onclick="moveEmpDown(${i})" class="text-[10px] bg-white/70 text-stone-500 rounded px-1.5 hover:bg-orange-100 hover:text-[#C85A44] ${i === appData.employees.length - 1 ? 'opacity-0 pointer-events-none' : ''} transition shadow-xs backdrop-blur-xs">▼</button>
                            </div>
                            <div class="pl-1">
                                <span class="font-bold text-sm text-[#4A3E3D]">${emp.name}</span>
                                <span class="text-xs font-black ${balColor} block">$${formatPrice(emp.balance)}</span>
                            </div>
                        </div>
                        <div class="flex space-x-1.5">
                            <button onclick="editEmpBalance(${i})" class="text-xs bg-orange-50 hover:bg-orange-100 text-[#C85A44] font-medium px-3 py-1.5 rounded-lg transition">更正</button>
                            <button onclick="deleteEmployee(${i})" class="text-xs bg-red-50 hover:bg-red-100 text-red-500 font-medium px-3 py-1.5 rounded-lg transition">刪除</button>
                        </div>
                    </div>`;
            });

            const storeSettingContainer = document.getElementById('setting-stores');
            storeSettingContainer.innerHTML = '';
            appData.stores.forEach((store, sIdx) => {
                let menuHtml = '';
                store.menu.forEach((item, mIdx) => {
                    menuHtml += `
                        <div class="flex justify-between items-center pl-1 border-b border-orange-100/20 pb-2 last:border-0 last:pb-0 relative z-10">
                            <span class="text-sm text-stone-500 font-medium">${item.name}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm theme-text font-bold mr-1">$${formatPrice(item.price)}</span>
                                <button onclick="editMenuPrice(${sIdx}, ${mIdx})" class="text-[10px] bg-white/70 text-stone-500 font-medium px-2 py-1 rounded transition shadow-xs backdrop-blur-xs">改價</button>
                                <button onclick="deleteMenuItem(${sIdx}, ${mIdx})" class="text-[10px] bg-red-50/70 text-red-500 font-medium px-2 py-1 rounded transition shadow-xs backdrop-blur-xs">刪除</button>
                            </div>
                        </div>`;
                });

                storeSettingContainer.innerHTML += `
                    <div class="bg-white/55 p-4 rounded-3xl border border-orange-100/40 shadow-sm relative backdrop-blur-xs">
                        <div class="flex justify-between items-center mb-3 border-b border-orange-100/30 pb-3 relative z-10">
                            <h4 class="font-bold text-sm text-[#4A3E3D] flex items-center">
                                <svg class="w-4 h-4 mr-1.5 theme-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                ${store.name}
                            </h4>
                            <div class="flex space-x-2">
                                <button onclick="addMenuItem(${sIdx})" class="text-xs text-[#C85A44] font-bold bg-white/70 px-2.5 py-1 rounded-md shadow-xs backdrop-blur-xs">+ 餐點</button>
                                <button onclick="deleteStore(${sIdx})" class="text-xs text-red-500 font-bold bg-red-50/70 px-2.5 py-1 rounded-md shadow-xs backdrop-blur-xs">刪店家</button>
                            </div>
                        </div>
                        <div class="space-y-3">${menuHtml || '<span class="text-xs text-stone-400 block py-1">目前菜單內尚無餐點</span>'}</div>
                    </div>`;
            });
        }

        async function updateSettingsAction(callback) {
            document.getElementById('global-loading').classList.remove('hidden');
            try {
                callback();
                await db.collection("System").doc("Settings").set(appData);
                renderAll();
            } finally {
                document.getElementById('global-loading').classList.add('hidden');
            }
        }

        function addEmployee() { const name = prompt("請輸入新員工姓名："); if(name) updateSettingsAction(() => appData.employees.push({name: name, balance: 0})); }
        function editEmpBalance(i) { const bal = prompt(`修改「${appData.employees[i].name}」的存摺可用餘額：`, appData.employees[i].balance); if(bal !== null && !isNaN(bal)) updateSettingsAction(() => appData.employees[i].balance = parseFloat(bal)); }
        function deleteEmployee(i) { if(confirm(`確定刪除 ${appData.employees[i].name} 嗎？`)) updateSettingsAction(() => appData.employees.splice(i, 1)); }
        function moveEmpUp(i) { if(i===0)return; updateSettingsAction(() => { let temp = appData.employees[i]; appData.employees[i] = appData.employees[i-1]; appData.employees[i-1] = temp; }); }
        function moveEmpDown(i) { if(i===appData.employees.length-1)return; updateSettingsAction(() => { let temp = appData.employees[i]; appData.employees[i] = appData.employees[i+1]; appData.employees[i+1] = temp; }); }
        function addStore() { const name = prompt("請輸入新店家名稱："); if(name) updateSettingsAction(() => appData.stores.push({id: 'store_' + Date.now(), name: name, menu: []})); }
        function deleteStore(sIdx) { if(confirm(`確定刪除店家「${appData.stores[sIdx].name}」及旗下整張菜單嗎？`)) updateSettingsAction(() => appData.stores.splice(sIdx, 1)); }
        function addMenuItem(sIdx) { const name = prompt("餐點名稱："); if(!name) return; let price = prompt(`價格：`); if(price !== null && !isNaN(price)) updateSettingsAction(() => appData.stores[sIdx].menu.push({name: name, price: parseFloat(price)})); }
        function editMenuPrice(storeIndex, menuIndex) { let item = appData.stores[storeIndex].menu[menuIndex]; let newPrice = prompt(`「${item.name}」新價格：`, item.price); if(newPrice !== null && !isNaN(newPrice)) updateSettingsAction(() => item.price = parseFloat(newPrice)); }
        function deleteMenuItem(storeIndex, menuIndex) { if(confirm("確定刪除此餐點項目嗎？")) updateSettingsAction(() => appData.stores[storeIndex].menu.splice(menuIndex, 1)); }

        window.onload = init;
    </script>
</body>
</html>
