<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>午餐結算 - 企業總表版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #FDF9F5; 
            color: #4A3E3D; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hidden-view { display: none !important; }
        .glass-panel { background: rgba(255, 252, 248, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(210, 180, 160, 0.4); box-shadow: 0 8px 30px rgba(100, 70, 50, 0.08); }
        .glass-nav { background: rgba(255, 252, 248, 0.70); backdrop-filter: blur(24px); border-top: 1px solid rgba(210, 180, 160, 0.4); }
        .theme-text { color: #C85A44; }
        .emp-selected { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%) !important; color: white !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(200, 90, 68, 0.3); transform: translateY(-1px); font-weight: 700; }
        .btn-active:active { transform: scale(0.97); }
        .nav-active { color: #C85A44; }
        .nav-inactive { color: #B0A09A; }
    </style>
</head>
<body class="p-4 pb-24 max-w-md mx-auto">

    <!-- Views -->
    <div id="view-pos" class="view-section">
        <div class="mb-4">
            <input type="date" id="order-date" onchange="changeDate()" class="text-sm font-medium text-[#C85A44] bg-white/60 px-3 py-1.5 rounded-full border-none outline-none shadow-sm focus:ring-2 focus:ring-orange-300 transition">
        </div>
        <div class="relative mb-4">
            <select id="store-selector" onchange="changeStore()" class="w-full glass-panel text-[#C85A44] text-lg rounded-2xl p-4 outline-none font-bold text-center appearance-none transition"></select>
        </div>
        <div id="pending-employees" class="grid grid-cols-3 gap-2.5 mb-4"></div>
        <div id="current-menu" class="grid grid-cols-2 gap-2.5 mb-4"></div>
        <div id="completed-orders" class="space-y-2 mb-6"></div>
    </div>

    <div id="view-ledger" class="view-section hidden-view">
        <div class="bg-gradient-to-br from-orange-50/60 to-amber-50/60 p-5 rounded-3xl mb-4 border border-orange-100/40">
            <span class="text-stone-500 text-xs">應有現金總額</span>
            <div id="admin-cash-on-hand" class="text-2xl font-black text-orange-500">$0</div>
        </div>
        <div id="ledger-table" class="space-y-2"></div>
    </div>

    <div id="view-settings" class="view-section hidden-view">
        <div id="setting-employees" class="mb-6"></div>
        <div id="setting-stores" class="mb-6"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav p-2.5 flex justify-around">
        <button onclick="switchTab('view-pos')" class="nav-active flex flex-col items-center p-2">點餐</button>
        <button onclick="switchTab('view-ledger')" class="nav-inactive flex flex-col items-center p-2">存摺</button>
        <button onclick="switchTab('view-settings')" class="nav-inactive flex flex-col items-center p-2">設定</button>
    </nav>

    <script>
        // Minimal logic skeleton to ensure functionality
        let appData = { employees: [], stores: [], orders: [] };
        
        function switchTab(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden-view'));
            document.getElementById(viewId).classList.remove('hidden-view');
        }

        function renderOrders() {
            const container = document.getElementById('completed-orders');
            container.innerHTML = appData.orders.map(order => `
                <div class="bg-white p-3 rounded-xl border border-orange-50">
                    <span class="font-bold">${order.empName}</span>: <span>${order.food}</span>
                    <span class="font-bold text-[#C85A44] ml-2">$${Number(order.price.toFixed(1))}</span>
                </div>
            `).join('');
        }

        // Add more logic here as per the project requirements...
        console.log("App Initialized");
    </script>
</body>
</html>
