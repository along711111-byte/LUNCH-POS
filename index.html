<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>午餐結算 - 日式鍋物版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #FDF9F5; /* 圖片載入前的暖色底 */
            /* 這裡載入你的專屬背景圖 */
            background-image: url('背景1.png'); 
            background-size: cover; 
            background-position: center top;
            background-attachment: fixed;
            color: #4A3E3D; 
            -webkit-tap-highlight-color: transparent; 
        }
        .hidden-view { display: none !important; }
        
        /* 日式和紙毛玻璃質感 (提高一點白底透明度，蓋住複雜背景確保文字清晰) */
        .glass-panel { background: rgba(255, 252, 248, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(210, 180, 160, 0.4); box-shadow: 0 8px 30px rgba(100, 70, 50, 0.08); }
        .glass-nav { background: rgba(255, 252, 248, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(210, 180, 160, 0.4); }
        
        /* 萃取自圖中螃蟹/蝦子的陶土橘紅色 */
        .theme-gradient { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%); }
        .theme-text { color: #C85A44; }
        
        /* 按鈕與選中狀態 */
        .emp-selected { background: linear-gradient(135deg, #D97055 0%, #C85A44 100%) !important; color: white !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(200, 90, 68, 0.3); transform: translateY(-1px); font-weight: 700; }
        .btn-active:active { transform: scale(0.97); }
        
        /* 導覽列狀態 */
        .nav-active { color: #C85A44; }
        .nav-inactive { color: #B0A09A; }
        
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); } 
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        #loading-overlay { position: fixed; inset: 0; background: rgba(253, 249, 245, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #C85A44; text-align: center; }
    </style>
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen flex flex-col pb-safe relative">

    <div id="loading-overlay">
        <svg class="w-12 h-12 mb-4 animate-spin text-[#C85A44]" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <h2 class="text-lg font-bold tracking-widest text-[#4A3E3D]">系統連線中...</h2>
    </div>

    <header class="theme-gradient sticky top-0 z-20 shadow-lg rounded-b-2xl">
        <div class="px-6 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white tracking-widest flex items-center">
                LUNCH POS
            </h1>
            <input type="date" id="order-date" onchange="changeDate()" class="text-sm font-medium text-[#C85A44] bg-white/95 px-3 py-1.5 rounded-full border-none outline-none shadow-sm focus:ring-2 focus:ring-orange-300 transition">
        </div>
    </header>

    <main class="w-full flex-grow relative px-4 mt-6">

        <!-- ================= 分頁 1：點餐 POS 機 ================= -->
        <div id="view-pos" class="space-y-6">
            
            <div class="relative">
                <select id="store-selector" onchange="changeStore()" class="w-full glass-panel text-[#C85A44] text-lg rounded-2xl p-4 outline-none font-bold text-center appearance-none transition focus:ring-2 focus:ring-[#C85A44]/20">
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-[#C85A44]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-3xl">
                <div class="mb-5">
                    <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        選擇對象 <span class="text-xs text-stone-400 font-normal ml-2">(可多選平分)</span>
                    </h2>
                    <div id="pending-employees" class="grid grid-cols-3 gap-2.5"></div>
                </div>

                <div class="pt-4 border-t border-orange-100">
                    <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        選擇餐點
                    </h2>
                    <button onclick="addToCart('未點餐', 0)" class="btn-active w-full py-3.5 mb-3 bg-stone-50 border border-stone-200/60 rounded-xl text-center flex justify-center items-center text-stone-500 font-medium hover:bg-stone-100 transition">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        本日跳過 (未點餐)
                    </button>
                    <div id="current-menu" class="grid grid-cols-2 gap-2.5"></div>
                </div>
            </div>

            <!-- 懸浮購物車 -->
            <div class="theme-gradient p-5 rounded-3xl shadow-[0_10px_25px_rgba(200,90,68,0.25)] sticky bottom-4 z-10">
                <div class="flex justify-between items-end mb-2">
                    <div id="split-info" class="text-xs text-orange-100 font-medium h-4"></div>
                    <div class="text-right">
                        <span class="text-xs text-orange-100 mr-1">合計</span>
                        <span id="cart-total" class="text-2xl font-black text-white">$0</span>
                    </div>
                </div>
                <button onclick="submitCart()" id="submit-btn" class="btn-active w-full mt-3 py-3.5 rounded-xl font-bold tracking-widest transition bg-white/20 text-orange-50 pointer-events-none">
                    請選擇餐點
                </button>
            </div>

            <div class="pt-2">
                <h2 class="theme-text font-bold mb-3 text-sm tracking-wide flex items-center justify-between px-1">
                    <span>處理明細 (<span id="display-selected-date" class="text-stone-500">今日</span>)</span>
                </h2>
                <div id="completed-orders" class="space-y-2 mb-6"></div>
                
                <div class="glass-panel p-5 rounded-3xl">
                    <div class="flex justify-between items-center mb-4 border-b border-orange-100 pb-3">
                        <span class="text-sm theme-text font-bold flex items-center">
                            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            店家叫餐清單
                        </span>
                        <span class="text-xs text-stone-500 font-medium">總計：<span id="pos-today-total" class="font-bold theme-text text-lg ml-1">$0</span></span>
                    </div>
                    <div id="pos-detail-list" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>

        <!-- ================= 分頁 2：帳務存摺 ================= -->
        <div id="view-ledger" class="hidden-view space-y-6">
            
            <div class="bg-gradient-to-br from-orange-50 to-amber-50 p-5 rounded-3xl flex justify-between items-center border border-orange-100 shadow-sm opacity-95">
                <div class="flex flex-col">
                    <span class="text-[11px] text-orange-600 font-bold mb-1 tracking-wider flex items-center">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        總務金庫對帳
                    </span>
                    <span class="text-stone-500 text-xs">應有現金總額 (不分享)</span>
                </div>
                <div class="text-right">
                    <span id="admin-cash-on-hand" class="text-2xl font-black text-orange-500">$0</span>
                    <p id="admin-cash-note" class="text-[10px] text-stone-400 mt-1"></p>
                </div>
            </div>

            <button onclick="shareToLine()" class="btn-active w-full bg-white text-[#C85A44] border border-orange-200 py-4 rounded-2xl font-bold shadow-sm flex justify-center items-center hover:bg-orange-50 transition opacity-95">
                <svg class="w-5 h-5 mr-2 text-[#06C755]" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.3c0-4.3-4.2-7.8-9.4-7.8-5.2 0-9.4 3.5-9.4 7.8 0 3.8 2.6 7 6.3 7.6l1.3.4s-.4 1.4-.4 1.6c-.1.5.3.8.3.8l3.6-2.4 1.3-.9c1.9.1 6.4-2.7 6.4-7.1z"/></svg>
                複製結算清單至 LINE
            </button>

            <div class="glass-panel rounded-3xl overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <tbody id="ledger-table" class="divide-y divide-orange-100/50"></tbody>
                </table>
            </div>
        </div>

        <!-- ================= 分頁 3：系統設定 ================= -->
        <div id="view-settings" class="hidden-view space-y-6">
            <div class="glass-panel p-5 rounded-3xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="font-bold theme-text text-sm flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        員工餘額管理
                    </h2>
                    <button onclick="addEmployee()" class="text-xs text-[#C85A44] bg-orange-100 hover:bg-orange-200 px-3 py-1.5 rounded-full transition">+ 新增</button>
                </div>
                <div id="setting-employees" class="space-y-2.5"></div>
            </div>

            <div class="glass-panel p-5 rounded-3xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="font-bold theme-text text-sm flex items-center">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        菜單庫設定
                    </h2>
                    <button onclick="addStore()" class="text-xs text-[#C85A44] bg-orange-100 hover:bg-orange-200 px-3 py-1.5 rounded-full transition">+ 新增店家</button>
                </div>
                <div id="setting-stores" class="space-y-4"></div>
            </div>
        </div>

    </main>

    <!-- 懸浮底部導覽列 -->
    <div class="fixed bottom-6 left-0 w-full px-5 z-50">
        <nav class="glass-nav rounded-2xl flex justify-around p-2.5 shadow-[0_8px_30px_rgba(100,70,50,0.12)] border border-orange-50">
            <button onclick="switchTab('view-pos')" id="tab-pos" class="flex flex-col items-center p-2 w-1/3 nav-active transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">點餐</span>
            </button>
            <button onclick="switchTab('view-ledger')" id="tab-ledger" class="flex flex-col items-center p-2 w-1/3 nav-inactive transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">存摺</span>
            </button>
            <button onclick="switchTab('view-settings')" id="tab-settings" class="flex flex-col items-center p-2 w-1/3 nav-inactive transition rounded-xl">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[10px] font-bold tracking-wider">設定</span>
            </button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCN5T3Wy5M_Ei9JY1kqgc1YzmN4UMufQQw",
          authDomain: "date-ea265.firebaseapp.com",
          projectId: "date-ea265",
          storageBucket: "date-ea265.firebasestorage.app",
          messagingSenderId: "783131275726",
          appId: "1:783131275726:web:a0942ad1560b82e1783b9f"
        };
        firebase.initializeApp(firebaseConfig);
        const fdb = firebase.firestore();

        let appData = { employees: [], stores: [], orders: [] };
        let selectedEmps = []; 
        let currentCart = [];  
        let selectedDate = ""; 

        function getLocalISODate() {
            const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        }

        window.onload = async () => {
            selectedDate = getLocalISODate();
            document.getElementById('order-date').value = selectedDate;
            document.getElementById('display-selected-date').innerText = selectedDate.substring(5);
            
            try {
                await syncSettingsFromCloud(); 
                await syncOrdersFromCloud();   
                document.getElementById('loading-overlay').style.display = 'none';
                initStoreSelector();
                renderAll();
            } catch(e) { alert("連線失敗！請檢查網路。"); }
        };

        async function syncSettingsFromCloud() {
            const docRef = fdb.collection("System").doc("Settings");
            const docSnap = await docRef.get();
            if (docSnap.exists) {
                let data = docSnap.data();
                appData.employees = data.employees || [];
                appData.stores = data.stores || [];
            } else {
                appData.employees = [ { name: '王小明', balance: 0 }, { name: '阿迪', balance: 0 } ];
                appData.stores = [ { id: 's1', name: '測試便當店', menu: [{name: '排骨飯', price: 100}] } ];
                await docRef.set({ employees: appData.employees, stores: appData.stores });
            }
        }

        async function syncOrdersFromCloud() {
            const snapshot = await fdb.collection("Orders").where("date", "==", selectedDate).get();
            appData.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        async function saveSettingsToCloud() {
            await fdb.collection("System").doc("Settings").set({
                employees: appData.employees, stores: appData.stores
            });
        }

        async function changeDate() {
            document.getElementById('loading-overlay').style.display = 'flex';
            selectedDate = document.getElementById('order-date').value;
            document.getElementById('display-selected-date').innerText = selectedDate.substring(5);
            selectedEmps = []; currentCart = [];
            await syncOrdersFromCloud(); 
            document.getElementById('loading-overlay').style.display = 'none';
            renderAll();
        }

        function switchTab(viewId) {
            document.querySelectorAll('main > div').forEach(div => { if(div.id.startsWith('view-')) div.classList.add('hidden-view'); });
            document.getElementById(viewId).classList.remove('hidden-view');
            document.querySelectorAll('nav button').forEach(btn => { btn.classList.remove('nav-active'); btn.classList.add('nav-inactive'); });
            document.getElementById('tab-' + viewId.replace('view-', '')).classList.remove('nav-inactive');
            document.getElementById('tab-' + viewId.replace('view-', '')).classList.add('nav-active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAll() { renderPOS(); renderLedger(); renderSettings(); }

        function initStoreSelector() {
            const selector = document.getElementById('store-selector');
            selector.innerHTML = '';
            appData.stores.forEach(store => { selector.innerHTML += `<option value="${store.id}">選擇店家：${store.name}</option>`; });
        }

        function changeStore() { selectedEmps = []; currentCart = []; renderPOS(); }

        function toggleEmp(empName) {
            if (selectedEmps.includes(empName)) selectedEmps = selectedEmps.filter(n => n !== empName);
            else selectedEmps.push(empName);
            updateCartUI(); renderPOSLeft();
        }

        function addToCart(foodName, price) {
            currentCart.push({ name: foodName, price: price }); updateCartUI();
        }

        function updateCartUI() {
            const btn = document.getElementById('submit-btn');
            const splitInfo = document.getElementById('split-info');
            let total = currentCart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `$${total}`;

            if (selectedEmps.length > 0 && currentCart.length > 0) {
                if (total > 0 && selectedEmps.length > 1) {
                    splitInfo.innerText = `${selectedEmps.length} 人平分，每人 -$${Math.round(total / selectedEmps.length)}`;
                } else if (total === 0) {
                    splitInfo.innerText = `狀態：不叫餐`;
                } else {
                    splitInfo.innerText = `扣款名單：${selectedEmps.join(', ')}`;
                }
                btn.classList.remove('bg-white/20', 'text-orange-50', 'pointer-events-none');
                btn.classList.add('bg-white', 'text-[#C85A44]', 'shadow-lg');
                btn.innerText = `確認送出`;
            } else {
                splitInfo.innerText = "";
                btn.classList.add('bg-white/20', 'text-orange-50', 'pointer-events-none');
                btn.classList.remove('bg-white', 'text-[#C85A44]', 'shadow-lg');
                btn.innerText = `請選擇餐點`;
            }
        }

        async function submitCart() {
            let total = currentCart.reduce((sum, item) => sum + item.price, 0);
            let perPersonAmount = Math.round(total / selectedEmps.length);
            let foodNames = currentCart.map(item => item.name).join(' + ');
            let note = (selectedEmps.length > 1 && total > 0) ? ' (共食)' : '';
            let sharedCount = selectedEmps.length;
            
            let backupEmps = [...selectedEmps];
            let backupCart = JSON.parse(JSON.stringify(currentCart));

            backupEmps.forEach(empName => {
                let tempId = 'temp_' + Date.now() + Math.random(); 
                appData.orders.push({ 
                    id: tempId, date: selectedDate, empName: empName, 
                    food: foodNames + note, price: perPersonAmount, items: backupCart, shared: sharedCount
                });
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance -= perPersonAmount;
            });

            selectedEmps = []; currentCart = []; renderAll();

            try {
                let writePromises = backupEmps.map(empName => {
                    return fdb.collection("Orders").add({ 
                        date: selectedDate, empName: empName, food: foodNames + note, 
                        price: perPersonAmount, items: backupCart, shared: sharedCount, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
                await Promise.all(writePromises); 
                await saveSettingsToCloud();      
                syncOrdersFromCloud(); 
            } catch(e) {}
        }

        async function cancelOrder(orderId, empName, price) {
            let isSkip = price === 0;
            if(confirm(isSkip ? `要取消 ${empName} 的未點餐紀錄嗎？` : `要將 $${price} 退回給 ${empName} 嗎？`)) {
                const orderIndex = appData.orders.findIndex(o => o.id === orderId);
                if(orderIndex > -1) appData.orders.splice(orderIndex, 1);
                let emp = appData.employees.find(e => e.name === empName);
                if(emp) emp.balance += price;
                renderAll(); 

                try {
                    if(!orderId.startsWith('temp_')) await fdb.collection("Orders").doc(orderId).delete();
                    await saveSettingsToCloud();
                    syncOrdersFromCloud();
                } catch(e) {}
            }
        }

        function renderPOSLeft() {
            const orderedEmpNames = appData.orders.map(o => o.empName);
            const empContainer = document.getElementById('pending-employees');
            empContainer.innerHTML = '';
            let allDone = true;
            
            appData.employees.forEach(emp => {
                if (!orderedEmpNames.includes(emp.name)) {
                    allDone = false;
                    const isSelected = selectedEmps.includes(emp.name);
                    const btnClass = isSelected ? 'emp-selected' : 'bg-white/80 text-[#4A3E3D] border-orange-100 hover:border-orange-300';
                    empContainer.innerHTML += `<button onclick="toggleEmp('${emp.name}')" class="btn-active py-3 border rounded-xl transition font-medium text-sm ${btnClass} truncate px-1 shadow-sm">${emp.name}</button>`;
                }
            });
            if (allDone) empContainer.innerHTML = '<p class="text-xs text-stone-500 col-span-3 text-center py-2 flex justify-center items-center"><svg class="w-4 h-4 mr-1 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>所有同事皆已處理</p>';
        }

        function renderPOS() {
            renderPOSLeft(); updateCartUI();

            const storeId = document.getElementById('store-selector').value;
            const currentStore = appData.stores.find(s => s.id === storeId);
            const menuContainer = document.getElementById('current-menu');
            menuContainer.innerHTML = '';
            
            if(currentStore) {
                currentStore.menu.forEach(item => {
                    menuContainer.innerHTML += `
                        <button onclick="addToCart('${item.name}', ${item.price})" class="btn-active p-3.5 bg-white/80 border border-orange-100 rounded-xl hover:border-orange-300 transition text-left flex flex-col justify-between shadow-sm">
                            <span class="font-bold text-[#4A3E3D] text-sm truncate">${item.name}</span>
                            <span class="theme-text font-bold mt-1 text-sm">$${item.price}</span>
                        </button>`;
                });
            }

            const orderContainer = document.getElementById('completed-orders');
            orderContainer.innerHTML = '';
            let totalAmount = 0; let itemCounts = {}; 

            if(appData.orders.length === 0) {
                orderContainer.innerHTML = '<div class="text-center py-5"><span class="text-xs text-stone-400">目前尚無明細</span></div>';
            }

            appData.orders.forEach(order => {
                totalAmount += order.price;
                if(order.food !== "未點餐" && order.items && order.shared) {
                    order.items.forEach(item => {
                        if(item.name === "未點餐") return;
                        if(!itemCounts[item.name]) itemCounts[item.name] = 0;
                        itemCounts[item.name] += (1 / order.shared); 
                    });
                }

                let isSkip = order.food === "未點餐";
                let foodClass = isSkip ? "text-stone-400" : "text-stone-500";
                
                orderContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white/70 p-3.5 rounded-2xl border border-orange-50 shadow-sm">
                        <div class="flex-grow overflow-hidden pr-3">
                            <span class="font-bold text-[#4A3E3D] text-sm block mb-0.5">${order.empName}</span>
                            <span class="text-xs ${foodClass} truncate block w-full">${order.food}</span>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            ${!isSkip ? `<span class="font-bold theme-text text-sm">$${order.price}</span>` : ''}
                            <button onclick="cancelOrder('${order.id}', '${order.empName}', ${order.price})" class="text-orange-500 bg-orange-50 hover:bg-orange-100 px-3 py-1.5 rounded-lg text-xs font-medium transition">退單</button>
                        </div>
                    </div>`;
            });

            document.getElementById('pos-today-total').innerText = `$${totalAmount}`;
            const detailContainer = document.getElementById('pos-detail-list');
            detailContainer.innerHTML = '';
            let hasItems = false;
            
            for (let itemName in itemCounts) {
                let count = Math.round(itemCounts[itemName]); 
                if (count > 0) {
                    hasItems = true;
                    detailContainer.innerHTML += `
                        <div class="bg-orange-50/80 border border-orange-100 text-[#C85A44] text-xs font-bold px-3 py-2 rounded-xl flex items-center">
                            <span class="mr-2">${itemName}</span>
                            <span class="bg-white text-orange-500 px-1.5 py-0.5 rounded-md text-[10px] shadow-sm">x ${count}</span>
                        </div>`;
                }
            }
            if (!hasItems) detailContainer.innerHTML = '<span class="text-xs text-stone-400">目前尚無餐點需預訂</span>';
        }

        function renderLedger() {
            let totalCash = appData.employees.reduce((sum, emp) => sum + emp.balance, 0);
            let cashElement = document.getElementById('admin-cash-on-hand');
            cashElement.innerText = `$${totalCash}`;
            if (totalCash < 0) {
                cashElement.classList.replace('text-orange-500', 'text-red-500');
            } else {
                cashElement.classList.replace('text-red-500', 'text-orange-500');
            }

            const tbody = document.getElementById('ledger-table');
            tbody.innerHTML = '';
            appData.employees.forEach(emp => {
                const balanceColor = emp.balance < 0 ? 'text-red-500' : (emp.balance > 0 ? 'text-green-600' : 'text-stone-400');
                const balanceText = emp.balance < 0 ? `欠款 $${Math.abs(emp.balance)}` : `$${emp.balance}`;
                tbody.innerHTML += `
                    <tr class="hover:bg-orange-50/50 transition">
                        <td class="p-4 font-bold text-[#4A3E3D]">${emp.name}</td>
                        <td class="p-4 text-right font-black ${balanceColor}">${balanceText}</td>
                    </tr>`;
            });
        }

        function shareToLine() {
            let text = `🍱 【午餐帳務結算】 ${selectedDate.replace(/-/g, '/')}\n══════════════════\n`;
            let negativeEmps = []; let positiveEmps = [];
            
            appData.employees.forEach(emp => {
                let dailyOrders = appData.orders.filter(o => o.empName === emp.name && o.date === selectedDate);
                let todayOrderInfo = "";
                if (dailyOrders.length > 0) {
                    let foodStr = dailyOrders.map(o => o.food).join(', ');
                    let totalSpent = dailyOrders.reduce((sum, o) => sum + o.price, 0);
                    todayOrderInfo = (foodStr === "未點餐") ? `\n  └ 今日跳過` : `\n  └ 今日: ${foodStr} (-$${totalSpent})`;
                }
                let infoStr = `• ${emp.name}｜`;
                if (emp.balance < 0) negativeEmps.push(`${infoStr}欠款 $${Math.abs(emp.balance)}${todayOrderInfo}`);
                else positiveEmps.push(`${infoStr}餘額 $${emp.balance}${todayOrderInfo}`);
            });
            
            if (negativeEmps.length > 0) text += `🔴 需補款名單：\n${negativeEmps.join('\n')}\n\n`;
            if (positiveEmps.length > 0) text += `🟢 餘額充足名單：\n${positiveEmps.join('\n')}\n\n`;
            text += `══════════════════\n💡 請欠款的同事記得找總務喔！`;

            navigator.clipboard.writeText(text).then(() => { alert("✅ 已成功複製！請切換到 LINE 貼上。"); })
            .catch(err => { alert("複製失敗，請手動複製。\n" + text); });
        }

        async function updateSettingsAction(actionFn) {
            actionFn(); renderAll(); 
            try { await saveSettingsToCloud(); } catch(e) {}
        }

        function renderSettings() {
            const empContainer = document.getElementById('setting-employees');
            empContainer.innerHTML = '';
            appData.employees.forEach((emp, i) => {
                const balColor = emp.balance < 0 ? 'text-red-500' : 'text-stone-500';
                empContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white/80 p-3.5 rounded-2xl border border-orange-50 shadow-sm">
                        <span class="font-bold text-sm text-[#4A3E3D]">${emp.name}</span>
                        <div class="flex items-center space-x-3">
                            <span class="text-sm font-black ${balColor}">$${emp.balance}</span>
                            <button onclick="editEmpBalance(${i})" class="text-xs bg-orange-50 hover:bg-orange-100 text-[#C85A44] font-medium px-3 py-1.5 rounded-lg transition">更正</button>
                        </div>
                    </div>`;
            });

            const storeContainer = document.getElementById('setting-stores');
            storeContainer.innerHTML = '';
            appData.stores.forEach((store, sIdx) => {
                let html = `
                    <div class="bg-white/80 p-4 rounded-3xl border border-orange-100 shadow-sm">
                        <div class="flex justify-between items-center mb-3 border-b border-orange-50 pb-3">
                            <span class="font-bold text-sm text-[#4A3E3D] flex items-center">
                                <svg class="w-4 h-4 mr-1.5 theme-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                ${store.name}
                            </span>
                            <button onclick="addMenuItem(${sIdx})" class="text-xs text-[#C85A44] font-bold bg-orange-50 px-2.5 py-1 rounded-md">+ 餐點</button>
                        </div>
                        <div class="space-y-2.5">`;
                store.menu.forEach((item, mIdx) => {
                    html += `
                        <div class="flex justify-between items-center pl-1">
                            <span class="text-sm text-stone-500 font-medium">${item.name}</span>
                            <div class="flex items-center space-x-3">
                                <span class="text-sm theme-text font-bold">$${item.price}</span>
                                <button onclick="editMenuPrice(${sIdx}, ${mIdx})" class="text-[10px] bg-stone-100 text-stone-500 font-medium px-2 py-1 rounded transition">改價</button>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
                storeContainer.innerHTML += html;
            });
        }

        function addEmployee() {
            let name = prompt("請輸入新同事姓名：");
            if(name) updateSettingsAction(() => appData.employees.push({name: name, balance: 0}));
        }

        function editEmpBalance(index) {
            let emp = appData.employees[index];
            let newBal = prompt(`請輸入 ${emp.name} 的正確餘額：`, emp.balance);
            if(newBal !== null && !isNaN(newBal)) updateSettingsAction(() => emp.balance = parseInt(newBal));
        }

        function addStore() {
            let name = prompt("請輸入新店家名稱：");
            if(name) updateSettingsAction(() => { appData.stores.push({id: 's'+Date.now(), name: name, menu: []}); initStoreSelector(); });
        }

        function addMenuItem(storeIndex) {
            let name = prompt("請輸入餐點名稱："); if(!name) return;
            let price = prompt(`請輸入「${name}」的價格：`);
            if(price !== null && !isNaN(price)) updateSettingsAction(() => appData.stores[storeIndex].menu.push({name: name, price: parseInt(price)}));
        }

        function editMenuPrice(storeIndex, menuIndex) {
            let item = appData.stores[storeIndex].menu[menuIndex];
            let newPrice = prompt(`請輸入「${item.name}」的新價格：`, item.price);
            if(newPrice !== null && !isNaN(newPrice)) updateSettingsAction(() => item.price = parseInt(newPrice));
        }
    </script>
</body>
</html>
